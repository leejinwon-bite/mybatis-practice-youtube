<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>

<form th:action="@{|/update/${board.id}|}" method="post" name="updateForm">
    <input type="hidden" name="id" th:value="${board.id}">
    제목: <input type="text" name="boardTitle" th:value="${board.boardTitle}"><br>
    작성자: <input type="text" name="boardWriter" th:value="${board.boardWriter}" readonly><br>
    비밀번호: <input type="text" name="boardPass" id="board-pass"><br>
    내용: <textarea type="text" name="boardContents" th:text="${board.boardContents}"
                  cols="30" rows="10"></textarea><br>
    <input type="button" value="수정" onclick="board_update()">
</form>

</body>

<script th:inline="javascript">
    function board_update() {
        const boardPass = document.getElementById("board-pass").value;
        const passDB = [[${board.boardPass}]];
        if (boardPass == passDB) {
<!--        updateForm 은 form태그의 name속성값임.-->
            updateForm.submit();
        } else
        {
            alert("비밀번호가 일치하지 않습니다.");
        }
    }
</script>

</html>
